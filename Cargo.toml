[workspace]
members = ["crates/sinew-core", "crates/sinew-ffi", "crates/sinew-godot"]
default-members = ["crates/sinew-core", "crates/sinew-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
